# Dependency updates, deliberately quiet: um PR por ecossistema, mensal.
#
# openGym é leve em dependências de propósito; o Dependabot abre no máximo um PR por
# ecossistema por mês (npm, docker, github-actions), com tudo agrupado, inclusive major.
# Ecossistemas diferentes sempre saem em PRs separados: é o limite do Dependabot.
# Advisories de segurança não dependem deste agendamento; o grupo "seguranca" os junta num PR só.
#
# Só os manifestos que existem aqui. Deliberadamente NÃO cobertos:
#   - gradle (frontend/android) e cocoapods (frontend/ios): o Capacitor gera esses shells e
#     fixa as versões nativas nos pacotes @capacitor/* do npm. Subir por fora dessincroniza e
#     quebra o build mobile; eles acompanham o bump do npm.
#
# Atenção na revisão: major agrupado (ex.: Capacitor 7 -> 8) vem junto dos demais. O CI só
# builda a web, não o mobile, então verde não prova que o major é seguro.
version: 2

updates:
  # frontend/package.json, api/package.json (@simplewebauthn/server verifica passkeys) e mcp/package.json
  - package-ecosystem: npm
    directories:
      - /frontend
      - /api
      - /mcp
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      tudo:
        patterns: ['*']
      seguranca:
        applies-to: security-updates
        patterns: ['*']

  # Imagens base: api/Dockerfile (node:22-alpine) e web/Dockerfile (node:22-alpine + nginx:alpine)
  - package-ecosystem: docker
    directories:
      - /api
      - /web
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    ignore:
      # Majors ímpares do Node são "Current", nunca LTS: param de receber correção em ~6 meses.
      # Majors pares (22 -> 24 -> 26) continuam sendo propostos.
      - dependency-name: node
        versions: ['25.x', '27.x', '29.x', '31.x', '33.x']
    groups:
      tudo:
        patterns: ['*']
      seguranca:
        applies-to: security-updates
        patterns: ['*']

  # Actions de .github/workflows/ (fixadas por SHA com a tag em comentário; o Dependabot troca os dois)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      tudo:
        patterns: ['*']
      seguranca:
        applies-to: security-updates
        patterns: ['*']
